name: NetPulse Cloud CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-verify:
    name: Backend (Java 21 · Maven · Flyway · OpenAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Make MVN Executable
        run: chmod +x ./mvnw
      - name: Generate OpenAPI sources & run tests
        run: ./mvnw -B clean verify

  frontend-verify:
    name: Frontend (Node 20 · Angular 20 Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & build production bundle
        run: |
          npm install
          npm run build
