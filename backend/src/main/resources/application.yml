spring:
  application:
    name: netpulse-backend

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${NETPULSE_DB_URL:jdbc:postgresql://localhost:5432/netpulse}
    username: ${NETPULSE_DB_USER:netpulse}
    password: ${NETPULSE_DB_PASSWORD:netpulse_dev_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    open-in-view: false
    hibernate:
      # Senior standard: Hibernate NEVER mutates schema; Flyway owns all DDL.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
